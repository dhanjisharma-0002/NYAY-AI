name: Forensic Engine Tests

on:
  push:
    branches:
      - feature/ai-evidence-intelligence
  pull_request:
    branches:
      - main
      - feature/ai-evidence-intelligence

jobs:
  test-forensic-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forensic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow

      - name: Run forensic engine tests
        run: |
          python -m pytest tests/test_forensic_engine.py -v
