server {
    listen 80;
    server_name localhost;

    # Maximum file upload size for digital evidence (matches config MAX_EVIDENCE_FILE_SIZE_MB)
    client_max_body_size 500M;

    # Serve static frontend UI (Ayushi Sharma)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Backend Orchestrator (Dhananjay Sharma)
    location /api/ {
        proxy_pass http://nyayai-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Health Checks
    location /health {
        proxy_pass http://nyayai-backend:8000/health;
        proxy_set_header Host $host;
    }
}
